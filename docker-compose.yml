services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: blast-message-backend:latest
    container_name: blast-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8083}:8083"
    environment:
      - WAHA_BASE_URL=${WAHA_BASE_URL:-https://waha.weddingofandricica.me}
      - WAHA_API_KEY=${WAHA_API_KEY:-Lollipop5.0qwerty244}
      - PORT=8083
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - moha_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8083/api}
    image: blast-message-frontend:latest
    container_name: blast-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - moha_network

networks:
  moha_network:
    external: true
